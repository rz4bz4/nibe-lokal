# Copy this to config.yaml and fill in your own pump.
# Every key can also be set as an environment variable: NIBE_HOST, NIBE_PORT, ...

# --- the pump -------------------------------------------------------------

# Your heat pump's IP address on your LAN. Find it in the router's DHCP list;
# it appears as NIBE-<serial number>. Required -- there is no default.
#
# On an F-series pump this is the *gateway's* address, not the pump's. An F750
# has a network socket but it only speaks to NIBE Uplink; Modbus arrives through
# a MODBUS 40 accessory on RS485 and a gateway. See docs/f-series.md.
host: ""

port: 502          # Modbus TCP. Enable it on the pump: menu 7.5.9 Modbus TCP/IP.
                   # On an F series, whatever port your gateway listens on.
unit: 1            # Modbus slave id. Try 1; if nothing answers, try 0.
                   # Through a MODBUS 40 it is fixed at 1 unless you changed it
                   # in the pump's menu 5.3.11 (needs MODBUS 40 v.10 or later).

# Which generation of NIBE the register numbers belong to. The two do not agree
# on numbering: the heating curve is 40027 on an S735 and 47007 on an F750, and
# 45001 is the writable "activate forced control" on every S map and a read-only
# alarm number on every F one. Getting this wrong is not a missing value, it is
# a plausible wrong one.
#
#   ""   derive it from `model` -- the normal case, and what you want
#   "S"  S735, S1155, S1255, S320, S2125, SMO S40, VVM S320/S325/S500
#   "F"  F750, F730, F470, F370, F1155, F1255, F1145, F1245, F1345, F1355,
#        and -- this is the one that surprises people -- the SMO 20, the SMO 40
#        and the VVM 225/310/320/325/500. See the model list below.
#
# Set it explicitly only when `model` is empty (because you are using
# register_csv) or when the derivation gets it wrong.
generation: ""

# How Modbus frames are wrapped on the TCP connection. Two boxes that both call
# themselves "RS485 to Ethernet" can want opposite things here, and picking the
# wrong one gives you a connection that opens and then times out with nothing in
# it -- the same symptom either way, which is why this is a setting and not a
# guess.
#
#   "tcp"  Modbus TCP: an MBAP header, no CRC. Every S-series pump, and any
#          gateway you have put into Modbus-TCP-to-RTU conversion mode
#          (Waveshare's "Modbus TCP<-->RTU", PUSR's "TCP server, Modbus TCP").
#   "rtu"  Raw RTU frames with their CRC16, forwarded byte for byte. Gateways in
#          transparent/passthrough mode -- which is the *default* on a Waveshare
#          RS485 TO ETH and needs nothing configured. This is Home Assistant's
#          "rtuovertcp".
#
# If you do not know which mode your gateway is in, try "rtu" first.
framing: "tcp"

# Which of the two 16-bit registers of a 32-bit value comes first. It only
# affects 32-bit registers -- the energy meters, the compressor hour counters,
# the 32-bit degree minutes -- and every 16-bit register reads correctly either
# way, which is what makes the wrong setting hard to recognise: the page looks
# right except for a handful of large, stable-looking nonsense numbers.
#
#   ""       ask the pump, and this is what you want.
#            S series: low word first. NIBE's own technical document specifies
#            it, it is not a setting there, and this app has always done it.
#            F series: it IS a setting -- the pump's menu 5.3.11, from MODBUS 40
#            software v.11 -- and it is also register 48852 "Modbus40 Word
#            Swap", so the app reads that register once at startup and uses what
#            it says. If the register does not answer it assumes the low word
#            first, and every backup header records which of the two happened.
#   true     low word first, whatever the pump says.
#   false    high word first (Big Endian), whatever the pump says.
#
# Worth knowing before you set it: NIBE's own two documents disagree. The
# MODBUS 40 installer manual says "Factory setting: Big Endian", and NIBE's
# register database gives 48852 a factory value of 1 -- "swapping the words in
# 32-bit variables" -- which is the opposite. The `nibe` python package and
# Home Assistant's integration both follow the register. So does this app, and
# that is why it would rather ask your pump than believe either of them.
# Nothing here has been checked against real hardware; see docs/f-series.md.
#
# Set it only after looking at menu 5.3.11, or after seeing the symptom above.
word_swap: ""

# --- the register map -----------------------------------------------------

# Used when register_csv is empty. Grouped by GENERATION, because that is what
# decides how every register number in this app is translated -- see
# `generation` above. How you reach the pump is a separate question, and the
# two do not line up the way the names suggest.
#
# S generation (register 40027 is the heating curve):
#   S735 S735C S1155 S1255 S1156 S1256 S320 S325 S330 S332 S2125
#   SMOS40 VVMS320 VVMS325 VVMS500
# F generation (47007 is the heating curve), and UNVERIFIED -- nobody has run
# this against one. Read docs/f-series.md before you trust anything it does:
#   F750 F730 F470 F370 F1155 F1255 F1145 F1245 F1345 F1355
#   SMO20 SMO40 VVM225 VVM310 VVM320 VVM325 VVM500
#
# The SMO 20 and SMO 40 are the pair worth pointing at, and this file used to
# get them wrong twice. They were listed as S-series models, which would have
# had the app reading 40027 on a controller whose heating curve is 47007; and
# this comment then said they have built-in Modbus TCP, which they do not.
# Their maps carry 48852 "Modbus40 Word Swap" and 48889 "MODBUS40 Disable
# LOG.SET" -- the MODBUS 40 accessory's own registers -- and no Modbus TCP
# registers at all, and the `nibe` package's own README offers TCP for S models
# only. They are F-generation controllers reached the F-generation way, and
# docs/f-series.md names the menu that switches it on: 5.2.4 on an SMO 40.
#
# Transport, which follows the generation and not the model name:
#   built-in Modbus TCP  : every S-series pump (menu 7.5.9)
#   MODBUS 40 on RS485   : the F-series pumps, the SMO 20/40 and the VVM indoor
#                          units, through a gateway. See docs/f-series.md.
model: ""

# Better: use your own pump's register list and point this at the CSV. It is
# the only map guaranteed to match your unit and its firmware, and it takes
# precedence over `model`. Where it comes from depends on the generation:
#   S series : on the pump, menu 7.5.9 -> "Export all registers" onto a USB
#              stick.
#   F series : there is no register export in the pump's USB menu. Use NIBE's
#              Windows tool ModbusManager -> File -> Export to file. That file
#              has whole register numbers (40004, 47007) where the S-series
#              export has offsets, and the app tells them apart by itself.
# A CSV carries no model name. On its own it is still a complete configuration
# -- the app works the generation out from the map, because 40027 is the
# heating curve on an S and 47007 on an F -- but if it somehow has both or
# neither, set `generation` below.
register_csv: ""

# --- the web app ----------------------------------------------------------

listen: "127.0.0.1"   # "0.0.0.0" to reach it from a phone on the same network
listen_port: 8377

# Modbus has no authentication, and neither does this app unless you set a
# token here. Anyone who can reach the port can change settings. Send it as an
# X-Auth-Token header, or once as ?token=... which the browser then remembers.
auth_token: ""

# The app only answers requests whose Host header is localhost, the bind
# address, or this machine's own name -- that is what stops a foreign web page
# (or a rebound DNS name) from reaching the pump through your browser. Add any
# other name you reach it by, space or comma separated: "varme.lan pi.local"
allowed_hosts: ""

# Bare IP addresses are always accepted (an IP cannot be DNS-rebound). Set this
# to true only if something in front of the app already checks the Host header.
allow_any_host: false

# --- history and safety ---------------------------------------------------

poll_seconds: 60      # NIBE allows 100 registers/s; 60 s is the community norm
history_days: 400     # older readings are pruned daily

# On an F series, 60 is the FLOOR rather than a comfortable default, and the
# reason is not the pump but the accessory. NIBE's own table limits a read of
# any register that is not in MODBUS 40's 20-entry LOG.SET file to one register
# per request (two words for a 32-bit value) with a 2.1 s maximum timeout, and
# users report the 2.1 s as real spacing rather than a timeout that is rarely
# reached. So the app asks for exactly one register at a time there, and the
# arithmetic is simply the number of registers:
#
#     20 dashboard registers an F750 answers  x ~2.1 s  ~= 40 s per poll
#     the 646 registers in the F750 map       x ~2.1 s  ~= 20-25 minutes
#
# (Twenty and not the twenty-five listed in nibelokal/pump.py: five of them have
# no F-series equivalent and are never asked for. See nibelokal/profile.py. The
# backup walks the whole map, which is 646 registers for an F750 -- so a backup
# there is a quarter of an hour and more, not the seconds it is on an S735.)
#
# Forty seconds of bus time inside a sixty-second poll leaves very little room,
# and a backup holds the bus for all of its minutes -- do not run one while you
# are waiting for a poll. Raise poll_seconds to 300 if the dashboard is enough
# once every five minutes, or put the dashboard registers in a LOG.SET file
# built with NIBE's ModbusManager, which lifts those twenty to 20 registers per
# request and a 0.5 s timeout. Nobody has measured any of this on real
# hardware -- if you do, docs/ISSUE-f-series.md is where that number goes.
# (The rate limiter is not the constraint and is not raised for this: 100
# registers a second is NIBE's ceiling and the RS485 bus is nowhere near it.)

# What those two cost on disk, because it is more than it looks. One row per
# register per poll, about 57 bytes a row once the indexes are counted, and the
# shipped dashboard is 25 registers:
#
#     rows = 25 x 86400 / poll_seconds x days
#
# At the two values above that is 36 000 rows a day -- roughly 21 MB per ten
# days, 750 MB and 13 million rows a year, and about 830 MB in the steady state
# once the 400-day prune starts biting. SQLite is fine with that; an SD card in
# a Pi is the thing to think about. Halving it is one of: fewer days here, a
# longer poll_seconds above, or a shorter DASHBOARD in nibelokal/pump.py.

# A full snapshot of every setting, taken automatically this often. A backup you
# have to remember to take is one you will not have when you need it -- and you
# need it right after changing something you should not have. 0 turns it off.
#
# Left commented out on purpose, because the right answer is not the same on the
# two generations and the app resolves it from the pump's:
#
#   S series: every 24 h. A full snapshot is a few seconds of Modbus TCP and
#             costs a few hundred kilobytes a year. This is what it has always
#             done and what it goes on doing.
#   F series: OFF. Through a MODBUS 40 the same snapshot is one register per
#             request at 2.1 s -- 20 to 35 minutes for a 646-register F750 map
#             -- and it is taken by the polling thread, which holds the pump's
#             only bus for all of it. Every poll in that window is skipped, the
#             page goes stale for half an hour, and an alarm raised meanwhile is
#             noticed when the backup finishes. A daily snapshot is worth
#             having; it is not worth having by default at that price on a
#             transport nobody has measured yet.
#
# Uncomment it to say what you want, on either generation. On an F pump a
# nightly one at an hour you are asleep is a perfectly reasonable thing to ask
# for -- it is being the default that is not. `nibelokal backup` takes one by
# hand whenever you like, and on an F pump it prints the estimate first.
# auto_backup_hours: 24

# false blocks every "guarded" write (heating curve, operating mode, hot water
# temperatures, ...) outright, leaving only the everyday ones. Blocked registers
# are never written regardless. See nibelokal/safety.py.
allow_guarded_writes: true

# What the heating water runs through. Only affects the advice: underfloor
# heating answers in a day or two and wants low supply temperatures, radiators
# answer in hours and want it hotter, and a house with both on one curve is
# always a compromise the advice should name rather than hide.
#   floor | radiators | mixed
emitters: "radiators"

database: "nibe.db"
backup_dir: "backup"
timeout: 5.0

# --- optional integrations ------------------------------------------------
#
# Everything below this line is optional and switched off until you fill it in.
# A fresh clone with none of it set starts, polls the pump, and serves the web
# app exactly as before -- the extra panels simply do not appear. If one of
# these services is down, misconfigured or slow, its own endpoint says so in
# plain Swedish and the rest of the app carries on. None of them can stop the
# pump from being read or written.

# --- indoor temperature, from Homey ---------------------------------------
#
# The pump only knows the room temperature if a room sensor is wired to it, and
# most installations have none. If you run a Homey Pro it already knows what
# every room is doing. This reads it; it never writes anything to Homey.
#
# The token is a *local* API key, made on the Homey itself:
#   my.homey.app -> Settings -> System (Advanced) -> API keys -> New API key,
#   scope homey.device.readonly (homey.zone.readonly as well if you want zone
#   names). The key is shown once. This is not the Athom cloud login.
# homey_host: "192.168.1.20"     # IP or hostname; http:// is added if missing
# homey_token: ""

# Which sensors to trust, by device name or id, comma separated. Empty means
# every device that reports a temperature -- convenient for a first look, and
# almost never right: door and window sensors sit in the draught on an outside
# wall and read several degrees off the room they live in. Once this number is
# allowed to influence heating, that bias becomes fuel.
# homey_devices: "Sovrum, Vardagsrum, Kontor"

# A sensor with a flat battery does not disappear; Homey keeps serving its last
# value forever. Readings older than this are marked stale and left out of the
# average, so a sensor frozen at 24 C in June cannot hold the heating down all
# winter.
# homey_max_age_minutes: 60
# homey_timeout: 5.0
# homey_cache_seconds: 120     # Homey is a small box; do not ask it every poll

# --- alarms ---------------------------------------------------------------
#
# The pump knows it has a problem the moment it has one (register 31976), and
# says nothing. A pump that has quietly dropped to the immersion heater still
# keeps the house warm; the first sign is the electricity bill six weeks later.
#
# Watching is always on and costs nothing: the alarm register is polled with
# everything else and every alarm and all-clear is written to the database and
# shown at /api/alarms. Only the push off the machine needs credentials.
#
# Pushover: an application token and your user key, both from pushover.net --
# log in, the user key is on the front page, then "Create an Application/API
# Token" for the application token. Leave either empty and nothing is sent.
#
# Check them without waiting for a real alarm: POST /api/alarms/test sends one
# ordinary-priority push and answers with what happened. A key pasted with a
# character missing is rejected by Pushover, and the rejection then shows up as
# `notify_error` on /api/alarms and in the status summary -- which is the only
# way anybody finds out that the notifications are not working.
# pushover_token: ""
# pushover_user: ""

# alarm_notify: true                # mute pushes without deleting the keys
# alarm_min_severity: "warning"     # info | warning | alarm -- lowest worth a push
# alarm_emergency_priority: true    # priority 2 for real alarms: repeats until
                                    # acknowledged. Turn it off if being woken at
                                    # 03:00 by a sensor fault is worse than
                                    # finding out at breakfast.
# alarm_retry_seconds: 300          # priority 2 only, Pushover minimum is 30
# alarm_expire_seconds: 10800       # priority 2 only, Pushover maximum is 10800

# Flap guard. A sensor sitting right on its limit raises and clears the same
# alarm on alternate polls, which at a 60 s poll is two pushes a minute. At most
# three notifications per alarm code go out inside this window; further
# transitions are held and arrive as one message saying how many times it has
# switched. Nothing is lost, and nobody is woken thirty times by one loose wire.
# alarm_debounce_seconds: 900

# --- weather forecast, from SMHI ------------------------------------------
#
# The pump's own sensor says what happened; a house with hours of thermal
# inertia needs to know what is about to happen. SMHI's open point forecast is
# free and needs no key -- only the coordinates of the house. Leave them empty
# and no forecast is fetched at all.
#
# Decimal degrees, dot as the decimal point, and do not swap them: a longitude
# in the latitude field is a point outside the model and answers 404.
# weather_lat: 59.3293
# weather_lon: 18.0686
# weather_ttl_minutes: 60      # SMHI's model runs about hourly; asking more
                               # often returns the same bytes
# weather_timeout: 8.0

# --- electricity prices, from Tibber --------------------------------------
#
# Only useful on an hourly variable contract. The plan this produces shifts
# load, it never sheds it: every hour it heats a step extra is paid back by an
# hour it coasts, within the same day, so the day's offsets sum to zero. It is
# advisory -- nothing in this app writes the heating offset by itself.
#
# The token is a personal API token from developer.tibber.com (log in with your
# Tibber account -> Get access token). Read-only for this purpose.
# tibber_token: ""
# tibber_home_id: ""           # only if your Tibber account has several homes

# spot_timeout: 10.0
# spot_cache_seconds: 900      # prices change twice a day; Tibber rate-limits
# spot_min_spread: 0.15        # kr/kWh over the horizon. Below this the day is
                               # too flat to be worth moving heat around for,
                               # and the plan proposes nothing.
# spot_cheap_rank: 0.25        # an hour is cheap in the bottom quartile
# spot_expensive_rank: 0.75    # and expensive in the top one
# spot_max_offset: 1           # steps of register 40031. Clamped to 1 whatever
                               # you write here: one step is already about
                               # 2.5 C of supply temperature.
# spot_max_pairs: 4            # at most this many hours up and as many down

# --- curve autotuning -----------------------------------------------------
#
# Watches weeks of history and proposes at most one small change, saying
# whether the curve's height or its slope is wrong. It needs an indoor
# temperature, which the pump does not have, so in practice it needs Homey
# above. Advisory only: it never writes.
#
# The temperature the house is supposed to hold. Optional: left empty, the
# analysis uses the room setpoint set on the pump's own display, which is the
# closest thing to a stated wish that exists without this key. Set it when the
# pump's setpoint is not what you actually want the house to hold -- on a pump
# with no room sensor that number regulates nothing, so it is easy to have left
# at something you never meant.
# autotune_target_indoor: 21.0
# autotune_days: 30            # how much history the analysis looks at
