[project]
name = "nibe-lokal"
# One version string, in nibelokal/__init__.py. Three copies of it disagreed
# once (package 0.2.1, wheel 0.3.0, git tag v0.3.1) and SMHI was told the
# oldest of them; read it from the package instead of retyping it here.
dynamic = ["version"]
description = "Local Modbus TCP web app for NIBE S-series heat pumps, without the cloud subscription"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "rz4bz4"}]
keywords = ["nibe", "modbus", "heat-pump", "myuplink", "home-automation"]
dependencies = []

[project.optional-dependencies]
# The register map. Not required if you export the CSV from the pump itself.
registers = ["nibe>=2.0"]
# Only used to read config.yaml comments-and-all; a plain parser is built in.
yaml = ["PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/rz4bz4/nibe-lokal"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nibelokal"]

[tool.setuptools.dynamic]
version = {attr = "nibelokal.__version__"}

# NIBE's alarm-code table ships with the package; without this an installed
# wheel would omit it and every alarm would read as an unknown number.
[tool.setuptools.package-data]
nibelokal = ["data/*.json"]

# Note: web/ lives at the repo root, not inside the package, and the server
# looks for it next to config.yaml. Run this from a clone
# (`python3 -m nibelokal ... serve`) rather than installing it -- there is no
# console script, because an installed one would not find the web app.
